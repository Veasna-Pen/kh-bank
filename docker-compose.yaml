services: 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kh-bank-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: 
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kh-bank-kafka
    depends_on: 
      - zookeeper
    ports:
      - "9093:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kh-bank-kafka-ui
    depends_on: 
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kh-bank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  postgres-auth:
    image: postgres:16-alpine
    container_name: kh-bank-postgres-auth
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data

  postgres-customer:
    image: postgres:16-alpine
    container_name: kh-bank-postgres-customer
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_db
    volumes:
      - postgres-customer-data:/var/lib/postgresql/data

  postgres-account:
    image: postgres:16-alpine
    container_name: kh-bank-postgres-account
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: account_db
    volumes:
      - postgres-account-data:/var/lib/postgresql/data

  postgres-transfer:
    image: postgres:16-alpine
    container_name: kh-bank-postgres-transfer
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transfer_db
    volumes:
      - postgres-transfer-data:/var/lib/postgresql/data

  postgres-ledger:
    image: postgres:16-alpine
    container_name: kh-bank-postgres-ledger
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger_db
    volumes:
      - postgres-ledger-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kh-bank-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    
volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-auth-data:
  postgres-customer-data:
  postgres-account-data:
  postgres-transfer-data:
  postgres-ledger-data:
  redis-data: